<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cellGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cellGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cellGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Mesh Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
        50% { transform: translateY(-16px) rotate(8deg) scale(1.05); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
        50% { transform: translateY(18px) rotate(-6deg) scale(0.97); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.12); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }
      @keyframes orbitFlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .cell-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: 1020px 140px; }
      .cell-2 { animation: floatAlt 8.5s ease-in-out infinite; transform-origin: 1080px 280px; }
      .cell-3 { animation: floatSlow 9.5s ease-in-out infinite 1.5s; transform-origin: 140px 100px; }
      .cell-4 { animation: floatAlt 10s ease-in-out infinite 0.5s; transform-origin: 160px 320px; }
      .glow-pulse { animation: pulseGlow 5s ease-in-out infinite alternate; }
      .dash-line { stroke-dasharray: 6 8; animation: dashMove 20s linear infinite; }
      .orbit-ring { transform-origin: 1040px 210px; animation: orbitFlow 30s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g class="glow-pulse" filter="url(#glow)">
    <circle cx="220" cy="180" r="140" fill="#0284c7" opacity="0.18" />
    <circle cx="1020" cy="210" r="180" fill="#7c3aed" opacity="0.22" />
    <circle cx="600" cy="380" r="130" fill="#059669" opacity="0.12" />
  </g>

  <!-- Biological 3D Cellular Mesh Connections & Simulation Particles (Background Elements) -->
  <g class="dash-line" opacity="0.35" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 920 120 Q 980 200 1060 140 T 1140 250" />
    <path d="M 980 320 C 1040 260 1010 160 1100 110" />
    <path d="M 80 140 Q 150 220 220 180 T 120 340" />
    <path d="M 1000 210 L 1090 120 M 1000 210 L 1110 300 M 1000 210 L 920 180" />
  </g>

  <!-- Orbiting Molecular Coordinates Ring (Positioned to right side) -->
  <g class="orbit-ring" opacity="0.3">
    <circle cx="1040" cy="210" r="120" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" fill="none" />
    <circle cx="1160" cy="210" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="920" cy="210" r="5" fill="#c084fc" filter="url(#softGlow)" />
    <circle cx="1040" cy="90" r="3.5" fill="#34d399" filter="url(#softGlow)" />
  </g>

  <!-- Dynamic 3D Simulated Cells Floating on Right Flank -->
  <g class="cell-1" filter="url(#softGlow)">
    <circle cx="1020" cy="140" r="54" fill="url(#cellGrad1)" stroke="#38bdf8" stroke-width="2" />
    <!-- Nucleus / Organelles -->
    <circle cx="1005" cy="130" r="22" fill="#0369a1" opacity="0.8" />
    <circle cx="1035" cy="155" r="8" fill="#bae6fd" opacity="0.7" />
    <circle cx="995" cy="150" r="6" fill="#7dd3fc" opacity="0.6" />
    <ellipse cx="1025" cy="125" rx="7" ry="12" fill="#38bdf8" opacity="0.4" transform="rotate(25 1025 125)" />
  </g>

  <g class="cell-2" filter="url(#softGlow)">
    <circle cx="1090" cy="280" r="66" fill="url(#cellGrad2)" stroke="#c084fc" stroke-width="2" />
    <!-- Cell Membrane Texture & Core -->
    <circle cx="1075" cy="270" r="28" fill="#7e22ce" opacity="0.8" />
    <circle cx="1115" cy="295" r="10" fill="#fbcfe8" opacity="0.75" />
    <circle cx="1060" cy="305" r="7" fill="#f472b6" opacity="0.6" />
    <ellipse cx="1100" cy="255" rx="8" ry="14" fill="#e879f9" opacity="0.5" transform="rotate(-30 1100 255)" />
  </g>

  <!-- Subtle Ambient Cells on Left Flank (Low visual density to protect typography) -->
  <g class="cell-3" filter="url(#softGlow)" opacity="0.45">
    <circle cx="130" cy="95" r="38" fill="url(#cellGrad3)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="122" cy="88" r="14" fill="#047857" opacity="0.7" />
    <circle cx="138" cy="105" r="5" fill="#a7f3d0" opacity="0.6" />
  </g>

  <g class="cell-4" filter="url(#softGlow)" opacity="0.4">
    <circle cx="120" cy="330" r="46" fill="url(#cellGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="112" cy="322" r="16" fill="#0284c7" opacity="0.7" />
    <circle cx="132" cy="342" r="6" fill="#bae6fd" opacity="0.5" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed prominent readability (No dynamic elements overlap) -->
  <g transform="translate(180, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="330" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#softGlow)" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7dd3fc" letter-spacing="1.5">CURATED AWESOME REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Bioengineering
    </text>
    
    <text x="0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
      &amp; 3D Cellular Simulation 🧬
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8">
      A comprehensive guide to multiscale tissue modeling, spatial omics,
    </text>
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8">
      agent-based cell mechanics, molecular dynamics &amp; systems biology.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 328)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">🔬 Multicellular</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="159" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#a855f7">🧬 Systems Bio</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="130" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="304" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#34d399">⚡ Agent-Based</text>

      <!-- Pill 4 -->
      <rect x="430" y="0" width="150" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="444" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#f43f5e">🌐 SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
